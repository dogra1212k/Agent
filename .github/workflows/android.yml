name: Android APK
on:
  push:
    branches: [main, 'work/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests, lint, and APKs
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Agent-Voice-1.0.0.apk
          sha256sum dist/Agent-Voice-1.0.0.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Voice-APK
          path: dist/Agent-Voice-1.0.0.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Instrumentation-APK
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-reports
          path: |
            app/build/reports/
            dist/SHA256SUMS.txt
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Agent-Voice-APK
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Instrumentation-APK
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Device-checks
          path: device-checks/
